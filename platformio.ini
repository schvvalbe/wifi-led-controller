[platformio]
default_envs = esp07

[env:esp07]
platform = espressif8266@4.2.1
board = esp07
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.1m64.ld
monitor_speed = 115200
upload_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5
extra_scripts =
    pre:scripts/embed_web.py
    post:scripts/check_ota_size.py
build_flags = -Wall -Wextra

[env:esp07_ota]
extends = env:esp07
extra_scripts =
    ${env:esp07.extra_scripts}
    pre:scripts/configure_ota.py
upload_protocol = custom
; Replace with the LAN IP, or override with pio run --upload-port.
upload_port = 192.168.4.1
upload_command = "$PYTHONEXE" "$PROJECT_DIR/scripts/upload_ota.py" --host "$UPLOAD_PORT" --file "$SOURCE"

